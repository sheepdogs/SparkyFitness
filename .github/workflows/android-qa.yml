name: Build Android Debug APK (QA)

# QA-only variant of android.yml: builds a DEBUG APK (dev client included,
# HTTP servers allowed) for local emulator QA of the multi-select feature
# branch. Not intended for the PR itself.

on:
  workflow_dispatch:
  push:
    tags:
      - "qa-*"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: |
          pnpm install --frozen-lockfile
          cd SparkyFitnessMobile
          npx expo prebuild --platform android

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-qa-${{ hashFiles('**/*.gradle*', '**/gradle-Wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Make gradlew executable
        run: chmod +x SparkyFitnessMobile/android/gradlew

      - name: Create local.properties
        run: |
          echo "sdk.dir=$ANDROID_HOME" > SparkyFitnessMobile/android/local.properties

      - name: Run Gradle to generate codegen (mirrors android.yml: tolerated failure)
        run: |
          cd SparkyFitnessMobile/android
          ./gradlew :app:assembleDebug || true

      - name: Build Debug APK
        run: |
          cd SparkyFitnessMobile/android
          ./gradlew :app:assembleDebug -x lint -x test --stacktrace

      - name: Upload Debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: sparkyfitness-debug-apk
          path: SparkyFitnessMobile/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
